server:
  port: 8080

spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/financedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass

  mongodb:
    uri: mongodb://root:rootpass@localhost:27017/financemongo?authSource=admin

jwt:
  secret: "ThisIsAFallbackSecretKeyThatIsAtLeast32BytesLongForLocalDev"
  expiration: 86400000