server:
  port: 8080

spring:
  main:
    lazy-initialization: true
  application:
    name: budget-service
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5432/financedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: redispass
    cassandra:
      contact-points: ${CASSANDRA_HOST:localhost}
      port: 9042
      local-datacenter: ${CASSANDRA_DC:datacenter1}
      keyspace-name: financeks
      schema-action: CREATE_IF_NOT_EXISTS
  mongodb:
    uri: mongodb://root:rootpass@${MONGO_HOST:localhost}:27017/financemongo?authSource=admin
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: 9042
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    keyspace-name: financeks
    schema-action: CREATE_IF_NOT_EXISTS

jwt:
  secret: "PEVxkwxSjgh4yIP8Jko0zQJsk/1SOWWBNMoo/FMnuII="
  expiration: 86400000 # 24 hours in ms
