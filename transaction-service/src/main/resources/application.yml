server:
  port: 8080

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://transaction-postgres:5432/financedb-transactions
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}
    neo4j:
      uri: ${SPRING_DATA_NEO4J_URI:bolt://localhost:7687}
      username: neo4j
      password: neo4jpass

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          # max-attempts is deprecated, max-retries should be used instead
          max-retries: 3

  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/financemongo?authSource=admin}

jwt:
  secret: ${JWT_SECRET:ThisIsAFallbackSecretKeyThatIsAtLeast32BytesLongForLocalDev}
  expiration: 86400000 # 24 hours in ms

# Neo4j connection resilience — prevent startup crash when Neo4j is slow/unavailable
neo4j:
  connection-timeout: 30s
  max-retry-time: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always
  health:
    neo4j:
      enabled: false
    redis:
      enabled: false
    mongo:
      enabled: false
    rabbit:
      enabled: false
    db:
      enabled: false

feign:
  user-service:
    url: http://user-service:8080

  account-service:
    url: http://account-service:8080

  budget-service:
    url: http://budget-service:8080

  reporting-service:
    url: http://reporting-service:8080

  transaction-service:
    url: http://transaction-service:8080
