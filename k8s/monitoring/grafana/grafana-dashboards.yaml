apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: financetracker
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Finance Tracker'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/provisioning/dashboards
  account-dashboard.json: |
    {
      "title": "Account Service Dashboard",
      "uid": "account-service",
      "schemaVersion": 38,
      "tags": ["Finance Tracker", "account-service", "observability"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Error Rate — Account Service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"financetracker\", service=\"account-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min"
            }
          ]
        },
        {
          "id": 2,
          "title": "Feign Call Outcomes — Account Service",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum by (level) (count_over_time({app=\"financetracker\", service=\"account-service\"} |= \"Feign\" [5m]))",
              "legendFormat": "{{level}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "RabbitMQ Event Audit — Account Service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"financetracker\", service=\"account-service\"} |~ \"Published|Consuming|Processed|transaction\\\\.(approved|completed|voided)|account\\\\.(status-changed|rated|stats-updated)\" [5m]))",
              "legendFormat": "events/5m"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (method, uri, status) (rate(http_server_requests_seconds_count{job=\"account-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}} {{status}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "P95 Response Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, uri, method) (rate(http_server_requests_seconds_bucket{job=\"account-service\"}[5m])))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "JVM Heap Used",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"account-service\", area=\"heap\"}",
              "legendFormat": "{{id}}"
            }
          ]
        }
      ],
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s"
    }
  budget-dashboard.json: |
    {
      "__inputs": [
        {
          "name": "DS_LOKI",
          "label": "Loki",
          "description": "",
          "type": "datasource",
          "pluginId": "loki",
          "pluginName": "Loki"
        },
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "datasource",
          "id": "loki",
          "name": "Loki",
          "version": "1.0.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        }
      ],
      "description": "Observability dashboard for the Budget Service — error rates, Feign downstream health, RabbitMQ events, latency, and JVM metrics.",
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "Budget Service Error Rate per Minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "expr": "count_over_time({app=\"financetracker\", service=\"budget-service\", level=\"ERROR\"}[1m])",
              "legendFormat": "Error Rate"
            }
          ]
        },
        {
          "id": 2,
          "title": "Feign Downstream Failures",
          "type": "logs",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "expr": "{service=\"budget-service\"} |= \"Feign call to\" | json | message=~ \"failed\"",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 3,
          "title": "RabbitMQ Event Audit",
          "type": "logs",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "${DS_LOKI}" },
          "targets": [
            {
              "refId": "A",
              "expr": "{service=\"budget-service\"} | json | routingKey=~ \"budget.*\"",
              "legendFormat": ""
            }
          ]
        },
        {
          "id": 4,
          "title": "Requests per Second",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(http_server_requests_seconds_count{job=\"budget-service\"}[5m])",
              "legendFormat": "{{method}} {{uri}} {{status}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "P99 Response Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{job=\"budget-service\"}[5m]))",
              "legendFormat": "P99 {{method}} {{uri}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Heap Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{area=\"heap\", job=\"budget-service\"}",
              "legendFormat": "Used Bytes"
            }
          ]
        }
      ],
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["Finance Tracker", "budget-service", "observability"],
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Budget Service — Observability",
      "uid": "budget-service-obs",
      "version": 1
    }
  reporting-dashboard.json: |
    {
      "__inputs": [
        {
          "name": "DS_LOKI",
          "label": "Loki",
          "description": "",
          "type": "datasource",
          "pluginId": "loki",
          "pluginName": "Loki"
        },
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "datasource",
          "id": "loki",
          "name": "Loki",
          "version": "1.0.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Observability dashboard for the Reporting Service — error rates, Feign downstream health, latency, and JVM metrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "Reporting Service Error Rate per Minute",
          "description": "Count of ERROR-level log lines emitted by the reporting-service per 1-minute window.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count_over_time({app=\"financetracker\", service=\"reporting-service\", level=\"ERROR\"}[1m])",
              "legendFormat": "Error Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "auto"
              },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          }
        },
        {
          "id": 2,
          "title": "Feign Downstream Failures (S1/S2/S3/S4)",
          "description": "Log lines from reporting-service indicating failed Feign calls to downstream services.",
          "type": "logs",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service=\"reporting-service\"} |= \"Feign call to\" | json | message=~ \"failed\"",
              "legendFormat": ""
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        },
        {
          "id": 3,
          "title": "Slow S5-F10 Four-Way Feign Warnings",
          "description": "Log lines from reporting-service indicating slow four-way Feign health score aggregations.",
          "type": "logs",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service=\"reporting-service\"} |= \"Slow\" | json",
              "legendFormat": ""
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        },
        {
          "id": 4,
          "title": "Requests per Second",
          "description": "HTTP request throughput for the reporting-service over a 5-minute rolling window.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(http_server_requests_seconds_count{job=\"reporting-service\"}[5m])",
              "legendFormat": "{{method}} {{uri}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          }
        },
        {
          "id": 5,
          "title": "P99 Response Time",
          "description": "99th-percentile HTTP response latency for the reporting-service over a 5-minute rolling window.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{job=\"reporting-service\"}[5m]))",
              "legendFormat": "P99 {{method}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          }
        },
        {
          "id": 6,
          "title": "Heap Memory Usage",
          "description": "JVM heap memory currently used by the reporting-service pod.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{area=\"heap\", job=\"reporting-service\"}",
              "legendFormat": "{{id}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "auto"
              },
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 268435456 },
                  { "color": "red", "value": 536870912 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max", "last"] }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["Finance Tracker", "reporting-service", "observability"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Reporting Service — Observability",
      "uid": "reporting-service-obs",
      "version": 2,
      "weekStart": ""
    }
