server:
  port: 8080

spring:
  application:
    name: account-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://account-postgres:5432/financedb-accounts}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/financemongo?authSource=admin}

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          # max-attempts is deprecated, max-retries should be used instead
          max-retries: 3

jwt:
  secret: ${JWT_SECRET:ThisIsAFallbackSecretKeyThatIsAtLeast32BytesLongForLocalDev}
  expiration: 86400000 # 24 hours in ms

feign:
  account-service:
    url: http://account-service:8080

  budget-service:
    url: http://budget-service:8080

  reporting-service:
    url: http://reporting-service:8080

  user-service:
    url: http://user-service:8080

  transaction-service:
    url: http://transaction-service:8080

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        
rabbitmq:
  exchanges:
    account: account.events
    transaction: transaction.events
  queues:
    transaction-saga-listener: account.transaction.saga-listener
    transaction-saga-listener-dlq: account.transaction.saga-listener.dlq
  routing-keys:
    transaction-approved: transaction.approved
    transaction-completed: transaction.completed
    transaction-voided: transaction.voided
