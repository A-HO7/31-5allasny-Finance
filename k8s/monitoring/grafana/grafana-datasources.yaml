apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: finance-tracker
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.finance-tracker.svc.cluster.local:3100
        isDefault: true
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.finance-tracker.svc.cluster.local:9090
