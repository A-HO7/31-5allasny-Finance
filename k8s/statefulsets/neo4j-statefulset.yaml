apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: financetracker
spec:
  serviceName: "neo4j"
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.18.0
          env:
            - name: NEO4J_AUTH
              value: "neo4j/neo4jpass"
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7474
              name: http
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-pvc
