server:
  port: 8080

spring:
  application:
    name: budget-service
  datasource:
    url: jdbc:postgresql://localhost:5432/financedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: redispass
#    cassandra:
#      contact-points: ${CASSANDRA_HOST:localhost}
#      port: 9042
#      local-datacenter: ${CASSANDRA_DC:datacenter1}
#      keyspace-name: financeks
#      schema-action: CREATE_IF_NOT_EXISTS
  mongodb:
    uri: mongodb://root:rootpass@${MONGO_HOST:localhost}:27017/financemongo?authSource=admin&serverSelectionTimeoutMS=50&connectTimeoutMS=50&socketTimeoutMS=50
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: 9042
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    keyspace-name: financeks
    schema-action: CREATE_IF_NOT_EXISTS
    connection:
      connect-timeout: 50ms
      init-query-timeout: 50ms
    request:
      timeout: 50ms

jwt:
  secret: ${JWT_SECRET:ThisIsAFallbackSecretKeyThatIsAtLeast32BytesLongForLocalDev}
  expiration: 86400000 # 24 hours in ms

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: TRACE
