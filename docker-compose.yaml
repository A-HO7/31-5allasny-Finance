services:
  # PostgreSQL - User Service
  user-postgres:
    image: postgres:17
    container_name: user-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedb-users
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financedb-users"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Account Service
  account-postgres:
    image: postgres:17
    container_name: account-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedb-accounts
    volumes:
      - account-pgdata:/var/lib/postgresql/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financedb-accounts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Transaction Service
  transaction-postgres:
    image: postgres:17
    container_name: transaction-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedb-transactions
    volumes:
      - transaction-pgdata:/var/lib/postgresql/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financedb-transactions"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Budget Service
  budget-postgres:
    image: postgres:17
    container_name: budget-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedb-budgets
    volumes:
      - budget-pgdata:/var/lib/postgresql/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financedb-budgets"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Reporting Service
  reporting-postgres:
    image: postgres:17
    container_name: reporting-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedb-reporting
    volumes:
      - reporting-pgdata:/var/lib/postgresql/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financedb-reporting"]
      interval: 10s
      timeout: 5s
      retries: 5
  # pgAdmin
  # pgadmin:
  #  image: dpage/pgadmin4
  #  container_name: pgadmin
  #  ports:
  #    - "5050:80"
  #  environment:
  #    PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #    PGADMIN_DEFAULT_PASSWORD: admin
  #  depends_on:
  #    postgres:
  #      condition: service_healthy

  # MongoDB
  mongo:
    image: mongo:latest
    container_name: finance-mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: financemongo
    volumes:
      - mongo-data:/data/db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:latest
    container_name: finance-redis
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--requirepass",
        "redispass",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:9.0.3
    container_name: finance-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms128m -Xmx128m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Neo4j
  neo4j:
    image: neo4j:latest
    container_name: finance-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_server_memory_heap_max__size: 128m
      NEO4J_server_memory_heap_initial__size: 64m
      NEO4J_server_memory_pagecache_size: 32m
    volumes:
      - neo4j-data:/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Cassandra
  cassandra:
    image: cassandra:latest
    container_name: finance-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: financecluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_KEYSPACE: financeks
      JVM_OPTS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=128m"
    entrypoint:
      - /bin/bash
      - -c
      - |
        export JVM_OPTS="-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m -XX:MaxMetaspaceSize=128m ${JVM_OPTS}"
        exec /usr/local/bin/docker-entrypoint.sh cassandra -f
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cassandra-config/jvm-server.options:/etc/cassandra/jvm-server.options
      - ./cassandra-config/cassandra-env.sh:/etc/cassandra/cassandra-env.sh

    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s

  # Microservices
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -Dlogging.level.root=WARN"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/financedb-users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/financemongo?authSource=admin
    depends_on:
      user-postgres:
        condition: service_healthy

  account-service:
    build: ./account-service
    container_name: account-service
    ports:
      - "8082:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -Dlogging.level.root=WARN"
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-postgres:5432/financedb-accounts
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/financemongo?authSource=admin
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      account-postgres:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service
    ports:
      - "8083:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -Dlogging.level.root=WARN"
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-postgres:5432/financedb-transactions
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/financemongo?authSource=admin
      SPRING_DATA_NEO4J_URI: bolt://neo4j:7687
    depends_on:
      transaction-postgres:
        condition: service_healthy

  budget-service:
    build: ./budget-service
    container_name: budget-service
    ports:
      - "8084:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -Dlogging.level.root=WARN"
      SPRING_DATASOURCE_URL: jdbc:postgresql://budget-postgres:5432/financedb-budgets
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/financemongo?authSource=admin
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: 9042
    depends_on:
      budget-postgres:
        condition: service_healthy

  reporting-service:
    build: ./reporting-service
    container_name: reporting-service
    ports:
      - "8085:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -Dlogging.level.root=WARN"
      SPRING_DATASOURCE_URL: jdbc:postgresql://reporting-postgres:5432/financedb-reporting
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/financemongo?authSource=admin
    depends_on:
      reporting-postgres:
        condition: service_healthy

# Volumes
volumes:
  user-pgdata:
  account-pgdata:
  transaction-pgdata:
  budget-pgdata:
  reporting-pgdata:
  mongo-data:
  es-data:
  neo4j-data:
  cassandra-data: