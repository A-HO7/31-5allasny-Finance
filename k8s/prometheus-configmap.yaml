apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: finance-tracker
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # S3-INFRA will add their scrape job here
      - job_name: reporting-service
        static_configs:
          - targets: ["reporting-service.finance-tracker.svc.cluster.local:8080"]
        metrics_path: /actuator/prometheus
        
