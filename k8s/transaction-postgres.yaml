apiVersion: v1
kind: Secret
metadata:
  name: transaction-postgres-secret
  namespace: finance-tracker
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: financedb-transactions
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transaction-postgres-pvc
  namespace: finance-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transaction-postgres
  namespace: finance-tracker
spec:
  serviceName: transaction-postgres
  replicas: 1
  selector:
    matchLabels:
      app: transaction-postgres
  template:
    metadata:
      labels:
        app: transaction-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: transaction-postgres-secret
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: transaction-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-postgres
  namespace: finance-tracker
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: transaction-postgres
  clusterIP: None
